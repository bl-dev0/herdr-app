# Windows on ARM64 (Snapdragon): the app's tar.gz, built natively on GitHub's
# windows-11-arm runner. Unsigned; an artifact, not a release. The build
# scripts run as ARM64 there, so bindgen needs an ARM64 libclang.
name: windows-arm64

on:
  push:
    branches: [windows-arm64]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.95.0
  TARGET: aarch64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.TARGET }}
      # Zig's own ARM64 Windows build crashes (0xc0000005) building
      # libghostty-vt: the x64 one runs under emulation and still targets
      # aarch64-windows-msvc. build.rs takes it from ZIG.
      - name: Zig (x64, emulated)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest -UseBasicParsing https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($got -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") { throw "zig sha256 $got" }
          Expand-Archive $zip $env:RUNNER_TEMP
          $zig = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0\zig.exe"
          & $zig version
          "ZIG=$zig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: libclang for bindgen
        shell: pwsh
        run: |
          $dll = "C:\Program Files\LLVM\bin\libclang.dll"
          if (-not (Test-Path $dll)) { throw "no LLVM at $dll on this runner image" }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build and pack
        run: scripts/package "$TARGET"
      - name: It runs
        run: |
          tar -xzf dist/herdr-app-windows-aarch64.tar.gz -C dist
          dist/herdr-app/herdr-app.exe --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-app-windows-aarch64
          path: dist/herdr-app-windows-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 30
